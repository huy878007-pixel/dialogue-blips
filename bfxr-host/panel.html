<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对话音效控制台 · 深空当铺</title>
<style>
  :root{--bg:#0f1117;--panel:#171a23;--card:#1d212c;--card2:#232838;--line:#2c3346;
        --fg:#e9ecf4;--dim:#8b93a7;--accent:#5ee0c0;--accent2:#7aa2ff;--warn:#ff8f6b;--pink:#ff7ab6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:16px;flex:0 0 auto;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.4px}
  header .badge{font-size:11px;color:var(--dim);border:1px solid var(--line);
                padding:2px 8px;border-radius:20px}
  header .spacer{flex:1}
  main{display:flex;flex:1;min-height:0}
  .left{flex:1;overflow-y:auto;padding:16px 18px 40px;min-width:0}
  .right{flex:0 0 330px;border-left:1px solid var(--line);padding:16px;
         overflow-y:auto;background:var(--panel)}
  h2{font-size:12px;color:var(--accent);margin:20px 0 8px;font-weight:600;
     letter-spacing:.6px;text-transform:uppercase}
  h2:first-child{margin-top:0}
  .presets{display:flex;flex-wrap:wrap;gap:6px}
  button{background:var(--card2);color:var(--fg);border:1px solid var(--line);
         padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;
         font-family:inherit;transition:border-color .12s,background .12s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:#1c3b35;border-color:#2e6b5c;color:var(--accent);
                 font-size:14px;padding:11px 18px;width:100%;font-weight:600}
  button.primary:hover{background:#245047}
  button.ghost{background:transparent;font-size:12px;padding:5px 10px}
  button.danger:hover{border-color:var(--warn);color:var(--warn)}
  button:disabled{opacity:.4;cursor:default}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  [hidden]{display:none!important}
  .parameter-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
  .tiers{display:flex;gap:4px;background:var(--panel);padding:4px;border:1px solid var(--line);border-radius:10px}
  .tiers button{background:transparent;border-color:transparent}
  .tiers button[aria-pressed=true]{background:var(--card2);border-color:var(--accent);color:var(--accent)}
  .tier-description{font-size:12px;color:var(--dim);margin:0 0 14px}
  #syncStatus{font-size:11px;color:var(--dim)}
  .conflict{border:1px solid var(--warn);padding:10px 12px;border-radius:8px;margin-bottom:12px;color:var(--warn)}
  .conflict button{margin:8px 6px 0 0}
  .preview-mode{margin-top:10px}
  .row input[type=range]{min-width:0}
  @media(max-width:720px){
    body{height:auto;min-height:100vh;overflow:auto}
    header{flex-wrap:wrap;gap:8px;padding:12px}
    header h1{font-size:14px}
    main{display:flex;flex-direction:column}
    .left{overflow:visible;padding:16px 12px}
    .right{flex:auto;border-left:0;border-top:1px solid var(--line);overflow:visible;padding:16px 12px}
    .lhead{flex-wrap:wrap}.lhead .sum{flex-basis:100%;padding-left:19px}
    .row>label{flex-basis:76px}.val{flex-basis:48px}
    .tiers{width:100%}.tiers button{flex:1;padding:9px 7px}
  }

  .layer{background:var(--card);border:1px solid var(--line);border-radius:12px;
         margin-bottom:10px;overflow:hidden}
  .layer.off{opacity:.45}
  .lhead{display:flex;align-items:center;gap:10px;padding:10px 12px;
         background:var(--card2);cursor:pointer}
  .lhead .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .layer.off .lhead .dot{background:#4a5266}
  .lhead .name{font-weight:600;font-size:13px;flex:1}
  .lhead .sum{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .lbody{padding:12px;display:none}
  .layer.open .lbody{display:block}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .row > label{flex:0 0 92px;font-size:12px;color:var(--dim)}
  .row input[type=range]{flex:1;height:20px;-webkit-appearance:none;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:#333c52;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--accent);margin-top:-5px;cursor:pointer}
  input[type=range]::-moz-range-track{height:3px;background:#333c52;border-radius:2px}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;
    background:var(--accent);cursor:pointer}
  .val{flex:0 0 62px;text-align:right;font-size:11.5px;color:var(--fg);
       font-variant-numeric:tabular-nums}
  select{background:#0f1219;color:var(--fg);border:1px solid var(--line);
         border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;flex:1}
  .adv-toggle{font-size:11.5px;color:var(--accent2);cursor:pointer;user-select:none;
              margin:4px 0 8px;display:inline-block}
  .adv{display:none;border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
  .adv.open{display:block}

  canvas{width:100%;height:96px;background:#0b0e14;border:1px solid var(--line);
         border-radius:10px;display:block}
  .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
        margin:6px 0 14px;font-variant-numeric:tabular-nums}
  textarea{width:100%;background:#0f1219;color:var(--fg);border:1px solid var(--line);
           border-radius:8px;padding:9px;font:13px/1.5 inherit;resize:vertical;min-height:62px}
  .hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
  .chk{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--dim);cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>对话音效控制台</h1>
  <span class="badge" id="status">连接中…</span>
  <span class="badge" id="buildTag" title="页面版本：用来确认浏览器有没有加载到最新代码">build 3</span>
  <span id="syncStatus" role="status" aria-live="polite">正在连接同步…</span>
  <span class="spacer"></span>
  <label class="chk"><input type="checkbox" id="autoplay" checked> 改动即试听</label>
</header>

<main>
  <div class="left">
    <h2>预设音色</h2>
    <div class="presets" id="presets"></div>

    <div class="parameter-toolbar">
      <div class="tiers" role="group" aria-label="参数级别">
        <button type="button" data-tier="basic" aria-pressed="true">基础参数</button>
        <button type="button" data-tier="intermediate" aria-pressed="false">进阶参数</button>
        <button type="button" data-tier="advanced" aria-pressed="false">高阶参数</button>
      </div>
      <button class="ghost" id="addLayer">+ 加一层</button>
    </div>
    <p class="tier-description" id="tierDescription">音高、音量、发声包络与明亮度</p>
    <div class="conflict" id="syncConflict" role="alert" hidden>
      另一处也修改了参数。你的编辑已保留，请选择要使用的设置。
      <div><button id="useRemote">使用同步值</button><button id="keepLocal">保留我的修改</button></div>
    </div>
    <div id="layers"></div>
  </div>

  <div class="right">
    <canvas id="wave"></canvas>
    <div class="meta"><span id="dur">—</span><span id="peak">—</span></div>

    <button class="primary" id="playSingle">▶ 试听这个音</button>
    <div style="height:10px"></div>
    <a id="dlSingle" download="blip.wav"><button style="width:100%">⤓ 导出单音 WAV</button></a>
    <div class="row preview-mode"><label for="previewMode">自动试听</label>
      <select id="previewMode"><option value="single">单音</option><option value="sentence">整句</option></select>
    </div>

    <h2>句子试听</h2>
    <textarea id="text" aria-label="试听台词" maxlength="512">这批货来路不太干净，你最好给我个说法。</textarea>
    <div class="row" style="margin-top:10px">
      <label for="interval">间隔 ms</label><input type="range" id="interval" min="10" max="90" value="30"><span class="val" id="intervalV">30</span>
    </div>
    <div class="row">
      <label for="throttle">节流 ms</label><input type="range" id="throttle" min="20" max="200" value="55"><span class="val" id="throttleV">55</span>
    </div>
    <div class="row">
      <label for="jitter">音高抖动</label><input type="range" id="jitter" min="0" max="25" value="6"><span class="val" id="jitterV">6%</span>
    </div>
    <div style="height:6px"></div>
    <button class="primary" id="playSentence">▶ 整句播放</button>
    <div class="hint" id="cadenceHint"></div>
  </div>
</main>

<script>
// ---------------------------------------------------------------- 参数定义
const DEFAULTS = {
  WaveType:2, MasterVolume:0.5, AttackTime:0, SustainTime:0.3, SustainPunch:0,
  DecayTime:0.4, CompressionAmount:0.3, MinFrequency:0, Slide:0, DeltaSlide:0,
  VibratoDepth:0, VibratoSpeed:0, Overtones:0, OvertoneFalloff:0,
  ChangeRepeat:0, ChangeAmount:0, ChangeSpeed:1, ChangeAmount2:0, ChangeSpeed2:0,
  SquareDuty:0, DutySweep:0, RepeatSpeed:0, FlangerOffset:0, FlangerSweep:0,
  LpFilterCutoff:1, LpFilterCutoffSweep:0, LpFilterResonance:0,
  HpFilterCutoff:0, HpFilterCutoffSweep:0, BitCrush:0, BitCrushSweep:0,
};

const WAVES = ["方波 Square","锯齿 Saw","正弦 Sine","白噪音 Noise","三角 Triangle",
  "粉噪音 Pink Noise","Tan 失真","哨音 Whistle","Breaker 碎波","Bitnoise 1-bit",
  "Combo 轮换","Buzz 蜂鸣"];

const PARAMETER_TIERS = {
  basic: {
    description: "音高、音量、发声包络与明亮度",
    params: [
      ["AttackTime","起音",0,1,0.001],
      ["SustainTime","持续",0,1,0.001],
      ["DecayTime","衰减",0,1,0.001],
      ["LpFilterCutoff","明亮度（低通）",0,1,0.01],
    ],
  },
  intermediate: {
    description: "波形、泛音、颤音与音色质感",
    params: [
      ["Slide","滑音",-1,1,0.01],
      ["VibratoDepth","颤音幅度",0,1,0.01],
      ["VibratoSpeed","颤音速度",0,1,0.01],
      ["Overtones","泛音数",0,1,0.01],
      ["OvertoneFalloff","泛音衰减",0,1,0.01],
      ["SustainPunch","冲击",0,1,0.01],
      ["CompressionAmount","压缩",0,1,0.01],
      ["BitCrush","降位粗糙度",0,1,0.01],
      ["LpFilterResonance","低通共振",0,1,0.01],
      ["HpFilterCutoff","高通",0,1,0.01],
    ],
  },
  advanced: {
    description: "层延迟、变调、扫描与镶边细节",
    params: [
      ["MasterVolume","合成器音量",0,1,0.01],
      ["MinFrequency","最低频率",0,1,0.01],
      ["SquareDuty","方波占空",0,1,0.01],
      ["DeltaSlide","滑音加速",-1,1,0.01],
      ["DutySweep","占空扫描",-1,1,0.01],
      ["ChangeAmount","变调幅度",-1,1,0.01],
      ["ChangeSpeed","变调速度",0,1,0.01],
      ["ChangeRepeat","变调重复",0,1,0.01],
      ["ChangeAmount2","变调幅度2",-1,1,0.01],
      ["ChangeSpeed2","变调速度2",0,1,0.01],
      ["RepeatSpeed","重复速度",0,1,0.01],
      ["FlangerOffset","镶边偏移",-1,1,0.01],
      ["FlangerSweep","镶边扫描",-1,1,0.01],
      ["LpFilterCutoffSweep","低通扫描",-1,1,0.01],
      ["HpFilterCutoffSweep","高通扫描",-1,1,0.01],
      ["BitCrushSweep","降位扫描",-1,1,0.01],
    ],
  },
};

// ---------------------------------------------------------------- 预设
const PARAM_KEYS = Object.keys(DEFAULTS);

// 只有 PARAM_KEYS 里的键会发给引擎，避免层参数（gain/delay）混进合成参数表
function mk(hz, o, gain, delay){
  return {hz, gain: gain === undefined ? 1 : gain, delay: delay || 0, mute:false,
          p:Object.assign({}, DEFAULTS, o || {})};
}

function makePresets(voices){
  // 标签直接用服务端下发的 label，不再本地维护一份名字数组
  // （本地数组一旦和 /api/meta 的顺序对不上就会静默错位）
  const singles = Object.fromEntries(voices.map(voice=>[voice.label, [mk(voice.hz, voice.p)]]));
  return {
  ...singles,
  "女年轻 + 粉噪气声": [
    mk(1056, {WaveType:4, LpFilterCutoff:0.42, AttackTime:0.05, SustainTime:0.07,
      DecayTime:0.18, Slide:-0.10}, 1.0),
    mk(1056, {WaveType:5, LpFilterCutoff:0.50, AttackTime:0.02, SustainTime:0.03,
      DecayTime:0.10, Slide:0}, 0.22),
  ],
  "三角波 + 高八度叠层": [
    mk(1056, {WaveType:4, LpFilterCutoff:0.42, AttackTime:0.05, SustainTime:0.07,
      DecayTime:0.18, Slide:-0.10}, 1.0),
    mk(2112, {WaveType:4, LpFilterCutoff:0.55, AttackTime:0.04, SustainTime:0.04,
      DecayTime:0.12, Slide:-0.14}, 0.25),
  ],
  "粉噪主 + 三角体": [
    mk(900, {WaveType:5, LpFilterCutoff:0.55, AttackTime:0.02, SustainTime:0.05,
      DecayTime:0.14, Slide:-0.10}, 1.0),
    mk(1050, {WaveType:4, LpFilterCutoff:0.42, AttackTime:0.05, SustainTime:0.07,
      DecayTime:0.18, Slide:-0.10}, 0.65),
  ],

  // ---- 设计候选（见 音色设计讨论_2026-10-30.md §5）----
  // A: 只把音区降到动物森友会实测的 peppy/snooty 458 Hz，其余完全不动
  "候选A · 女声下移 460": [
    mk(460, {WaveType:4, LpFilterCutoff:0.42, AttackTime:0.05, SustainTime:0.07,
      DecayTime:0.18, Slide:-0.10}, 1.0),
  ],
  // B: A 加一层约 9 ms 的噪声爆破，模拟辅音起音
  "候选B · 女声+辅音": [
    mk(460, {WaveType:4, LpFilterCutoff:0.42, AttackTime:0.05, SustainTime:0.07,
      DecayTime:0.18, Slide:-0.10}, 1.0),
    mk(460, {WaveType:3, LpFilterCutoff:0.55, AttackTime:0.01, SustainTime:0.02,
      DecayTime:0.06, Slide:0, Overtones:0, OvertoneFalloff:0}, 0.26),
  ],
  // C: 主体 + 辅音 + 气声 + 轻微失谐（拟人四件套）
  "候选C · 女声三层": [
    mk(460, {WaveType:4, LpFilterCutoff:0.42, AttackTime:0.05, SustainTime:0.07,
      DecayTime:0.18, Slide:-0.10}, 1.0),
    mk(460, {WaveType:3, LpFilterCutoff:0.55, AttackTime:0.01, SustainTime:0.02,
      DecayTime:0.06, Slide:0, Overtones:0, OvertoneFalloff:0}, 0.26),
    mk(460, {WaveType:5, LpFilterCutoff:0.50, AttackTime:0.02, SustainTime:0.04,
      DecayTime:0.12, Slide:0, Overtones:0, OvertoneFalloff:0}, 0.14),
    mk(464, {WaveType:4, LpFilterCutoff:0.46, AttackTime:0.06, SustainTime:0.06,
      DecayTime:0.17, Slide:-0.10}, 0.30),
  ],
  // D: 动物森友会 crankly 的实测音区 88 Hz（真成人低音，不是把可爱声压低）
  "候选D · 老男 88Hz": [
    mk(88, {WaveType:4, LpFilterCutoff:0.50, AttackTime:0.06, SustainTime:0.12,
      DecayTime:0.22, Slide:-0.06, Overtones:0.20, OvertoneFalloff:0.55,
      VibratoDepth:0.08, VibratoSpeed:0.30}, 1.0),
    mk(88, {WaveType:3, LpFilterCutoff:0.45, AttackTime:0.01, SustainTime:0.02,
      DecayTime:0.05, Slide:0, Overtones:0, OvertoneFalloff:0}, 0.20),
  ],
  // E: 保留用户喜欢的高音区 1056 Hz，只加辅音和气声
  "候选E · 高音+辅音+气声": [
    mk(1056, {WaveType:4, LpFilterCutoff:0.42, AttackTime:0.05, SustainTime:0.07,
      DecayTime:0.18, Slide:-0.10}, 1.0),
    mk(1056, {WaveType:3, LpFilterCutoff:0.55, AttackTime:0.01, SustainTime:0.02,
      DecayTime:0.06, Slide:0, Overtones:0, OvertoneFalloff:0}, 0.22),
    mk(1056, {WaveType:5, LpFilterCutoff:0.50, AttackTime:0.02, SustainTime:0.03,
      DecayTime:0.10, Slide:0, Overtones:0, OvertoneFalloff:0}, 0.12),
  ],
  // F: 老成的"更亮"版本。代码里的男·老成已经改成三角波+低通0.72+泛音0.22（减闷版A），
  // 这个是更激进的减闷版B，用来判断"闷"到底治到什么程度才够。
  "候选F · 老成更亮": [
    mk(122, {WaveType:4, LpFilterCutoff:0.95, AttackTime:0.06, SustainTime:0.10,
      DecayTime:0.20, Slide:-0.06, Overtones:0.35, OvertoneFalloff:0.50}, 1.0),
  ],
}; }
let BASE_PRESETS = {};
let PRESETS = {};

// ---------------------------------------------------------------- 状态
let layers = [];
let audio = new Audio();
const actx = new (window.AudioContext || window.webkitAudioContext)();
let timer = null;
let requestId = 0, downloadUrl = null, playbackUrl = null;
let activeTier = "basic", selectedPreset = "女 · 年轻";
let serverRevision = 0, localVersion = 0, savedVersion = 0;
let syncReady = false, saving = false, polling = false, conflictSnapshot = null;
let saveTimer = null;
// 我们上一次成功写回的 revision。轮询靠它区分"远端真的改了"和"只是我们自己的回声"。
let lastSavedRevision = -1;
// 我们认为服务端当前持有的状态。用来在 409 时做三方合并——只重放自己的改动。
let baseState = null;
// 所有还在响的音频。切换时必须全部停掉，否则会叠在一起。
const liveAudios = new Set();
// 玩家改过的预设。{ 预设名: [层...] }，跟共享状态一起持久化。
// 有了它，"改完切走再切回来"就是改过的样子，而不是出厂值。
let presetOverrides = {};
// 从预设装载层的时候不要反而把预设标成"已修改"
let loadingPreset = false;

const $ = s => document.querySelector(s);

function clonePreset(list){ return JSON.parse(JSON.stringify(list)); }

// 基础预设 = 服务端 /api/meta 发来的出厂定义，只读不动。
// PRESETS = 基础 + 玩家改动，界面永远读这一份。
function rebuildPresets(){
  PRESETS = clonePreset(BASE_PRESETS);
  for (const name in presetOverrides){
    if (Array.isArray(presetOverrides[name]) && presetOverrides[name].length) {
      PRESETS[name] = clonePreset(presetOverrides[name]);
    }
  }
}

function isBuiltin(name){ return Object.prototype.hasOwnProperty.call(BASE_PRESETS, name); }

function applyPreset(name){
  const source = PRESETS[name];
  if (!source) return;
  loadingPreset = true;
  layers = clonePreset(source);
  selectedPreset = name;
  renderLayers(); renderPresets(); schedule();
  loadingPreset = false;
}

// 用户动了参数 → 把当前层存成这个预设的新定义
function rememberPresetEdit(){
  if (loadingPreset || !selectedPreset) return;
  presetOverrides[selectedPreset] = clonePreset(layers);
  rebuildPresets();
}

// 把当前这套层存成一个新的命名预设
function addPreset(name){
  name = (name || "").trim();
  if (!name) return "预设名不能为空";
  if (name.length > 60) return "预设名太长（最多 60 字）";
  if (Object.prototype.hasOwnProperty.call(PRESETS, name)) return "已有同名预设";
  if (Object.keys(presetOverrides).length >= 64) return "预设数量已达上限（64）";
  selectedPreset = name;
  presetOverrides[name] = clonePreset(layers);
  rebuildPresets();
  renderPresets(); renderLayers(); schedule();
  return "";
}

function deletePreset(name){
  if (isBuiltin(name)) return;           // 内置的只能改，不能删
  delete presetOverrides[name];
  if (selectedPreset === name){
    selectedPreset = Object.keys(PRESETS).find(key => key !== name) || "";
  }
  rebuildPresets();
  if (selectedPreset && PRESETS[selectedPreset]) layers = clonePreset(PRESETS[selectedPreset]);
  renderPresets(); renderLayers(); schedule();
}

// ---------------------------------------------------------------- 渲染 UI
function renderPresets(){
  const host = $("#presets");
  host.innerHTML = "";
  for (const name in PRESETS){
    const b = document.createElement("button");
    b.textContent = name;
    if (name === selectedPreset) b.setAttribute("aria-pressed", "true");
    if (!isBuiltin(name)) b.title = "你自己创建的预设";
    b.onclick = ()=>applyPreset(name);
    host.appendChild(b);
  }

  // 选中非内置预设时，给一个删除入口
  if (selectedPreset && !isBuiltin(selectedPreset)){
    const del = document.createElement("button");
    del.className = "ghost danger";
    del.textContent = "✕ 删除「" + selectedPreset + "」";
    del.style.cssText = "font-size:11.5px;padding:4px 9px";
    del.onclick = ()=>deletePreset(selectedPreset);
    host.appendChild(del);
  }

  // 新建入口
  const adder = document.createElement("span");
  adder.style.cssText = "display:inline-flex;gap:6px;align-items:center;margin-left:4px";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "新预设名";
  input.maxLength = 60;
  input.style.cssText = "width:110px;background:#0f1219;color:var(--fg);border:1px solid var(--line);" +
                        "border-radius:7px;padding:5px 8px;font:12px inherit";
  const go = document.createElement("button");
  go.className = "ghost";
  go.textContent = "+ 新建预设";
  go.style.cssText = "font-size:11.5px;padding:4px 9px";
  const submit = ()=>{
    const error = addPreset(input.value);
    if (error){ input.value = ""; input.placeholder = error;
                input.style.borderColor = "var(--warn)"; setTimeout(()=>{input.placeholder="新预设名";
                input.style.borderColor = "";}, 2200); return; }
    input.value = ""; input.placeholder = "新预设名";
  };
  go.onclick = submit;
  input.onkeydown = e => { if (e.key === "Enter") submit(); };
  adder.append(input, go);
  host.appendChild(adder);
}

function slider(label, key, min, max, step, val, oninput){
  const row = document.createElement("div");
  row.className = "row";
  const id = "s_" + key + "_" + Math.random().toString(36).slice(2,7);
  row.innerHTML = `<label for="${id}">${label}</label>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">
    <span class="val"></span>`;
  const inp = row.querySelector("input");
  inp.dataset.key = key;
  const out = row.querySelector(".val");
  const show = v => parseFloat(v).toFixed(step >= 0.1 ? 1 : (step >= 0.01 ? 2 : 3));
  out.textContent = show(val);
  inp.oninput = ()=>{ out.textContent = show(inp.value); oninput(parseFloat(inp.value)); };
  return row;
}

function renderLayers(){
  const host = $("#layers");
  host.innerHTML = "";
  layers.forEach((L, i)=>{
    const card = document.createElement("div");
    card.className = "layer open" + (L.mute ? " off" : "");

    const head = document.createElement("div");
    head.className = "lhead";
    head.innerHTML = `<span class="dot"></span>
      <span class="name">第 ${i+1} 层 · ${WAVES[L.p.WaveType|0]}</span>
      <span class="sum">${Math.round(L.hz)} Hz · 音量 ${L.gain.toFixed(2)}</span>`;
    head.onclick = e => { if (e.target.tagName !== "BUTTON") card.classList.toggle("open"); };

    const body = document.createElement("div");
    body.className = "lbody";

    for (const [tier, config] of Object.entries(PARAMETER_TIERS)){
      const section = document.createElement("div");
      section.dataset.parameterTier = tier;
      section.hidden = tier !== activeTier;
      if (tier === "basic"){
        section.appendChild(slider("音高 Hz", "hz", 40, 3000, 1, L.hz, v=>{
          L.hz = v; updateSummary(); schedule();
        }));
        section.appendChild(slider("层音量", "gain", 0, 1.5, 0.01, L.gain, v=>{
          L.gain = v; updateSummary(); schedule();
        }));
      }
      if (tier === "intermediate"){
        const wrow = document.createElement("div");
        wrow.className = "row";
        const label = document.createElement("label");
        label.textContent = "波形"; label.htmlFor = "wave_" + i;
        const select = document.createElement("select");
        select.id = label.htmlFor;
        WAVES.forEach((wave,k)=>{
          const option = document.createElement("option");
          option.value = k; option.textContent = `${k} · ${wave}`; select.appendChild(option);
        });
        select.value = L.p.WaveType;
        select.onchange = ()=>{ L.p.WaveType = Number(select.value); updateSummary(); schedule(); };
        wrow.append(label,select); section.appendChild(wrow);
      }
      if (tier === "advanced")
        section.appendChild(slider("层延迟 ms", "delay", 0, 120, 1, L.delay, v=>{ L.delay = v; schedule(); }));
      for (const [key,label,min,max,step] of config.params)
        section.appendChild(slider(label,key,min,max,step,L.p[key],v=>{ L.p[key] = v; schedule(); }));
      body.appendChild(section);
    }

    function updateSummary(){
      head.querySelector(".name").textContent = `第 ${i+1} 层 · ${WAVES[L.p.WaveType|0]}`;
      head.querySelector(".sum").textContent = `${Math.round(L.hz)} Hz · 音量 ${L.gain.toFixed(2)}`;
    }

    // 层操作
    const ops = document.createElement("div");
    ops.style.cssText = "display:flex;gap:6px;margin-top:10px";
    const bMute = document.createElement("button");
    bMute.className = "ghost";
    bMute.textContent = L.mute ? "启用" : "静音";
    bMute.onclick = ()=>{ L.mute = !L.mute; renderLayers(); schedule(); };
    const bDup = document.createElement("button");
    bDup.className = "ghost"; bDup.textContent = "复制";
    bDup.disabled = layers.length >= 8;
    bDup.onclick = ()=>{ if (layers.length >= 8) return; layers.splice(i+1, 0, JSON.parse(JSON.stringify(L))); renderLayers(); schedule(); };
    const bDel = document.createElement("button");
    bDel.className = "ghost danger"; bDel.textContent = "删除";
    bDel.onclick = ()=>{ if (layers.length === 1) return; layers.splice(i,1); renderLayers(); schedule(); };
    ops.append(bMute, bDup, bDel);
    body.appendChild(ops);

    card.append(head, body);
    host.appendChild(card);
  });
  $("#addLayer").disabled = layers.length >= 8;
}

// ---------------------------------------------------------------- 与引擎通信
function buildForm(){
  const f = new URLSearchParams();
  layers.forEach((L, i)=>{
    f.set(`layer${i}.mute`, L.mute ? 1 : 0);
    f.set(`layer${i}.gain`, L.gain);
    f.set(`layer${i}.delay`, L.delay);
    f.set(`layer${i}.hz`, L.hz);
    if (L.mute) return;
    // 只发合成参数，gain/delay 已单独处理，不会串味
    for (const k of PARAM_KEYS) f.set(`layer${i}.${k}`, L.p[k]);
  });
  return f;
}

async function fetchWav(path, form){
  const res = await fetch(path, {method:"POST", body:form});
  if (!res.ok) throw new Error("HTTP " + res.status + ": " + await res.text());
  return await res.arrayBuffer();
}

function stopAllAudio(){
  for (const a of liveAudios){
    try{ a.pause(); a.currentTime = 0; }catch(_){ }
  }
  liveAudios.clear();
}

function playUrl(url){
  // 先把所有在响的都停掉，再播新的。之前只 pause() 当前那一个，
  // 快速切换时前一个（已经不被引用）会继续响，听起来就是几个声音叠着。
  stopAllAudio();
  if (playbackUrl && playbackUrl !== downloadUrl) URL.revokeObjectURL(playbackUrl);
  playbackUrl = url;
  audio = new Audio(url);
  liveAudios.add(audio);
  audio.onended = ()=>{
    liveAudios.delete(audio);
    if (playbackUrl === url){
      playbackUrl = null;
      if (url !== downloadUrl) URL.revokeObjectURL(url);
    }
  };
  return audio.play();
}

function showMetrics(buf){
  drawWave(buf);
  $("#dur").textContent = (buf.duration*1000).toFixed(0) + " ms";
  let pk = 0; const data = buf.getChannelData(0);
  for (const sample of data) pk = Math.max(pk, Math.abs(sample));
  $("#peak").textContent = "峰值 " + (pk*100).toFixed(0) + "%";
}

function drawWave(buf){
  const c = $("#wave"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  ctx.scale(dpr, dpr);
  const w = c.clientWidth, h = c.clientHeight;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = "#2c3346"; ctx.beginPath();
  ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
  const data = buf.getChannelData(0);
  const step = Math.max(1, Math.floor(data.length / w));
  ctx.strokeStyle = "#5ee0c0"; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x < w; x++){
    let mn = 1, mx = -1;
    for (let i = 0; i < step; i++){
      const v = data[x*step + i] || 0;
      if (v < mn) mn = v; if (v > mx) mx = v;
    }
    ctx.moveTo(x, h/2 - mx*h/2*0.92);
    ctx.lineTo(x, h/2 - mn*h/2*0.92);
  }
  ctx.stroke();
}

async function refresh(play){
  clearTimeout(timer);
  const id = ++requestId;
  try{
    $("#status").textContent = "生成中…";
    const ab = await fetchWav("/api/voice", buildForm());
    const buf = await actx.decodeAudioData(ab.slice(0));
    if (id !== requestId) return;
    showMetrics(buf);

    const url = URL.createObjectURL(new Blob([ab], {type:"audio/wav"}));
    if (downloadUrl && downloadUrl !== playbackUrl) URL.revokeObjectURL(downloadUrl);
    downloadUrl = url;
    $("#dlSingle").href = url;
    $("#dlSingle").download = "blip.wav";
    if (play){
      await playUrl(url);
    }
    if (id !== requestId) return;
    $("#status").textContent = "就绪 · " + layers.length + " 层";
  }catch(e){
    if (id === requestId) $("#status").textContent = "错误：" + e.message;
  }
}

function schedule(playAnyway){
  rememberPresetEdit();
  queueStateSave();
  clearTimeout(timer);
  ++requestId;
  timer = setTimeout(()=>{
    const play = playAnyway !== false && $("#autoplay").checked;
    if (play && $("#previewMode").value === "sentence") playSentence();
    else refresh(play);
  }, 160);
}

async function playSentence(){
  clearTimeout(timer);
  const id = ++requestId;
  try{
    $("#status").textContent = "生成句子…";
    const f = buildForm();
    f.set("text", $("#text").value);
    f.set("interval", $("#interval").value);
    f.set("throttle", $("#throttle").value);
    f.set("jitter", $("#jitter").value);
    const ab = await fetchWav("/api/sentence", f);
    const buf = await actx.decodeAudioData(ab.slice(0));
    if (id !== requestId) return;
    const url = URL.createObjectURL(new Blob([ab], {type:"audio/wav"}));
    showMetrics(buf);
    await playUrl(url);
    if (id !== requestId) return;
    $("#status").textContent = "就绪 · 句子";
  }catch(e){ if (id === requestId) $("#status").textContent = "错误：" + e.message; }
}

// ---------------------------------------------------------------- 共享状态
function cloneState(value){ return JSON.parse(JSON.stringify(value)); }

// 收集 base -> cur 之间变化的叶子路径。数组长度变了就整段替换（加层/删层）。
function diffPaths(base, cur, prefix, out){
  const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  if (isObj(base) && isObj(cur)){
    const keys = new Set([...Object.keys(base), ...Object.keys(cur)]);
    for (const key of keys){
      if (!(key in cur)){ out.push([prefix.concat(key), DELETED]); continue; }
      diffPaths(base[key], cur[key], prefix.concat(key), out);
    }
  } else if (Array.isArray(base) && Array.isArray(cur)){
    if (base.length !== cur.length) out.push([prefix, cur]);
    else base.forEach((item, index)=>diffPaths(item, cur[index], prefix.concat(index), out));
  } else if (base !== cur){
    out.push([prefix, cur]);
  }
  return out;
}

// 删除哨兵：diff 时发现某个键在新状态里没有了，就用它标记"要删掉"
const DELETED = Object.freeze({__deleted: true});

function deleteAtPath(root, path){
  if (path.length === 0) return root;
  let node = root;
  for (let i = 0; i < path.length - 1; i++){
    if (node[path[i]] === null || typeof node[path[i]] !== "object") return root;
    node = node[path[i]];
  }
  delete node[path[path.length - 1]];
  return root;
}

function setPath(root, path, value){
  if (path.length === 0) return value;
  let node = root;
  for (let i = 0; i < path.length - 1; i++){
    const key = path[i];
    if (node[key] === null || typeof node[key] !== "object")
      node[key] = typeof path[i+1] === "number" ? [] : {};
    node = node[key];
  }
  node[path[path.length - 1]] = value;
  return root;
}


function captureState(){
  return {
    layers: layers.map(layer=>({hz:layer.hz,gain:layer.gain,delay:layer.delay,mute:layer.mute,
      p:Object.fromEntries(PARAM_KEYS.map(key=>[key,layer.p[key]]))})),
    sentence:{text:$("#text").value,interval:Number($("#interval").value),
      throttle:Number($("#throttle").value),jitter:Number($("#jitter").value)},
    autoplay:$("#autoplay").checked, previewMode:$("#previewMode").value, selectedPreset,
    presets:presetOverrides,
  };
}

async function stateRequest(method, body){
  const response = await fetch("/api/state", {method,
    ...(body ? {headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {})});
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

function showSync(snapshot){
  const source = snapshot.source === "assistant" ? "助手修改" : snapshot.source === "browser" ? "你的修改" : "共享设置";
  $("#syncStatus").textContent = "已同步 · " + source;
}

function updateCadenceHint(){
  const interval = Number($("#interval").value), throttle = Number($("#throttle").value);
  const every = Math.max(1,Math.ceil(throttle / interval - 1e-9));
  $("#cadenceHint").textContent = `每字推进 ${interval} ms；连续普通文字约每 ${every} 字发声一次（${every*interval} ms）。`;
}

function applySharedState(snapshot, audition){
  serverRevision = snapshot.revision;
  const state = snapshot.state;
  loadingPreset = true;
  layers = JSON.parse(JSON.stringify(state.layers));
  selectedPreset = state.selectedPreset;
  presetOverrides = (state.presets && typeof state.presets === "object") ? structuredClone(state.presets) : {};
  if (selectedPreset) presetOverrides[selectedPreset] = clonePreset(layers);
  $("#autoplay").checked = state.autoplay;
  $("#previewMode").value = state.previewMode;
  $("#text").value = state.sentence.text;
  for (const key of ["interval","throttle","jitter"]){
    $("#"+key).value = state.sentence[key];
    $("#"+key+"V").textContent = state.sentence[key] + (key === "jitter" ? "%" : "");
  }
  updateCadenceHint();
  rebuildPresets();
  renderPresets(); renderLayers(); showSync(snapshot);
  loadingPreset = false;
  baseState = cloneState(state);
  if (audition){
    clearTimeout(timer); ++requestId;
    if (state.autoplay && state.previewMode === "sentence") playSentence();
    else refresh(state.autoplay);
  }
}

function queueStateSave(){
  if (!syncReady) return;
  localVersion++;
  $("#syncStatus").textContent = conflictSnapshot ? "存在同步冲突 · 编辑已保留" : "正在同步…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveSharedState, 180);
}

async function saveSharedState(retried, baseRevisionOverride, overrideState){
  // overrideState/baseRevisionOverride 只用于 409 之后的三方合并重试
  if (!syncReady || saving) return;
  if (!overrideState && localVersion === savedVersion) return;
  saving = true;
  const version = localVersion;
  let payloadState = overrideState || captureState();
  let baseRevision = baseRevisionOverride !== undefined ? baseRevisionOverride : serverRevision;

  // 主动三方合并：保存前先拿服务端最新状态，只把"我相对基线改过的字段"盖上去。
  // 之前是整份写回，谁最后保存谁赢——同时改不同字段会互相覆盖（外部 agent 改材质被页面盖回）。
  if (!overrideState && baseState){
    try{
      const snapshot = await stateRequest("GET");
      const merged = cloneState(snapshot.state);
      for (const [path, value] of diffPaths(baseState, payloadState, [], [])){
        if (value === DELETED) deleteAtPath(merged, path);
        else setPath(merged, path, value);
      }
      payloadState = merged;
      baseRevision = snapshot.revision;
    }catch(e){ /* 拿不到就退回原来的整份写回 */ }
  }
  try{
    const response = await fetch("/api/state", {method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({baseRevision,source:"browser",state:payloadState})});
    if (response.status === 409){
      // 远端在我们读完之后被别人（助手或另一个页面）改过。
      // 不要就此停摆：拉最新的 revision，用它在上面重试一次，后写者优先。
      // 只有重试仍然撞车才提示用户，避免一次偶发冲突让轮询永久卡死。
      const latest = await response.json();
      serverRevision = latest.revision;
      saving = false;
      // 三方合并：把"我相对基线的改动"盖到最新远端上，而不是整份覆盖。
      // 并发改不同字段时（助手改 gain、我改 hz）两边的改动都能留下。
      if (!retried && baseState && latest.state){
        let merged = cloneState(latest.state);
        for (const [path, value] of diffPaths(baseState, payloadState, [], []))
          merged = setPath(merged, path, value);
        saving = false;
        return saveSharedState(true, latest.revision, merged);
      }
      if (!retried) return saveSharedState(true);
      conflictSnapshot = latest;
      $("#syncConflict").hidden = false;
      $("#syncStatus").textContent = "存在同步冲突 · 编辑已保留";
      return;
    }
    if (!response.ok) throw new Error(await response.text());
    const snapshot = await response.json();
    serverRevision = snapshot.revision;
    lastSavedRevision = snapshot.revision;
    savedVersion = version;
    baseState = cloneState(payloadState);
    conflictSnapshot = null;
    $("#syncConflict").hidden = true;
    if (localVersion === savedVersion) showSync(snapshot);
  }catch(e){ $("#syncStatus").textContent = "同步失败 · 编辑已保留：" + e.message; }
  finally{ saving = false; }
}

async function pollSharedState(){
  if (!syncReady || saving || polling) return;
  if (conflictSnapshot) return;            // 等用户在冲突条上做选择
  polling = true;
  const version = localVersion;
  try{
    const snapshot = await stateRequest("GET");
    if (version !== localVersion) return;  // 拉取期间本地又改了，下一轮再说
    if (localVersion !== savedVersion){ await saveSharedState(); return; }
    if (snapshot.revision === serverRevision){ showSync(snapshot); return; }
    // 关键：如果我们自己刚写回的就是这个 revision，那这是回声，不是别人的修改。
    // 之前没区分，导致每次本地保存都会被当成远端更新再试听一遍 —— 就是"两个声音叠在一起"。
    if (snapshot.revision === lastSavedRevision){
      serverRevision = snapshot.revision;
      showSync(snapshot);
      return;
    }
    applySharedState(snapshot, true);
  }catch(e){ $("#syncStatus").textContent = "同步连接中断 · 正在重连"; }
  finally{ polling = false; }
}

document.querySelectorAll("[data-tier]").forEach(button=>{
  button.onclick = ()=>{
    activeTier = button.dataset.tier;
    document.querySelectorAll("[data-tier]").forEach(item=>item.setAttribute("aria-pressed",String(item === button)));
    document.querySelectorAll("[data-parameter-tier]").forEach(section=>{
      section.hidden = section.dataset.parameterTier !== activeTier;
    });
    $("#tierDescription").textContent = PARAMETER_TIERS[activeTier].description;
  };
});
$("#autoplay").onchange = queueStateSave;
$("#previewMode").onchange = queueStateSave;
$("#text").oninput = queueStateSave;
$("#useRemote").onclick = async()=>{
  try{
    const snapshot = await stateRequest("GET");
    savedVersion = localVersion; conflictSnapshot = null;
    $("#syncConflict").hidden = true;
    applySharedState(snapshot, true);
  }catch(e){ $("#syncStatus").textContent = "读取失败，请重试"; }
};
$("#keepLocal").onclick = async()=>{
  try{
    const snapshot = await stateRequest("GET");
    serverRevision = snapshot.revision; conflictSnapshot = null;
    $("#syncConflict").hidden = true;
    await saveSharedState();
  }catch(e){ $("#syncStatus").textContent = "连接失败，编辑已保留"; }
};

// ---------------------------------------------------------------- 绑定
$("#addLayer").onclick = ()=>{
  if (layers.length >= 8) return;
  layers.push({hz:1050, gain:0.5, delay:0, mute:false, p:Object.assign({}, DEFAULTS, {WaveType:5})});
  renderLayers(); schedule();
};
$("#playSingle").onclick = ()=>refresh(true);
$("#playSentence").onclick = playSentence;
["interval","throttle","jitter"].forEach(id=>{
  const el = $("#"+id), out = $("#"+id+"V");
  el.oninput = ()=>{ out.textContent = el.value + (id === "jitter" ? "%" : ""); updateCadenceHint(); queueStateSave(); };
});
$("#intervalV").textContent = "30";
$("#throttleV").textContent = "55";
$("#jitterV").textContent = "6%";

async function init(){
  try{
    const response = await fetch("/api/meta");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const meta = await response.json();
    Object.assign(DEFAULTS, meta.voiceBase);
    // The generator is the source of truth for the six approved voices.
    BASE_PRESETS = makePresets(meta.voices);
    rebuildPresets();
    const shared = await stateRequest("GET");
    applySharedState(shared, false);
    syncReady = true;
    await refresh(false);
    setInterval(pollSharedState, 500);
  }catch(e){ $("#status").textContent = "错误：" + e.message; }
}
init();
